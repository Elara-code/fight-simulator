<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#1C1F26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3B4D"/>
      <stop offset="100%" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80, 120)">
    <text x="0" y="60" font-family="'Noto Sans SC', sans-serif" font-size="64" font-weight="900" fill="#ffffff">把没吵赢的架</text>
    <text x="0" y="150" font-family="'Noto Sans SC', sans-serif" font-size="96" font-weight="900" fill="#ffffff">
      重新 <tspan fill="url(#accent)">吵赢</tspan> 一遍
    </text>
    <text x="0" y="240" font-family="'Noto Sans SC', sans-serif" font-size="32" fill="#8A94A6">AI 帮你复盘 · 生成反击 · 模拟对吵</text>
    <g transform="translate(0, 320)">
      <rect width="220" height="64" rx="32" fill="url(#accent)"/>
      <text x="110" y="43" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="900" fill="#fff">爽文反击</text>
    </g>
    <g transform="translate(240, 320)">
      <rect width="220" height="64" rx="32" fill="#ffffff14" stroke="#ffffff33"/>
      <text x="110" y="43" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="700" fill="#fff">逻辑碾压</text>
    </g>
    <g transform="translate(480, 320)">
      <rect width="220" height="64" rx="32" fill="#ffffff14" stroke="#ffffff33"/>
      <text x="110" y="43" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="700" fill="#fff">阴阳怪气</text>
    </g>
    <g transform="translate(720, 320)">
      <rect width="220" height="64" rx="32" fill="#ffffff14" stroke="#ffffff33"/>
      <text x="110" y="43" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="700" fill="#fff">冷静终结</text>
    </g>
  </g>
  <text x="1120" y="580" text-anchor="end" font-family="'Noto Sans SC', sans-serif" font-size="24" fill="#8A94A6">吵架模拟器</text>
</svg>
